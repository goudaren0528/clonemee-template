<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>assistant 指挥台</title>
  <style>
@@TOKENS@@
  </style>
  <style>
@@BASE_CSS@@
  </style>
  <style>
@@PAGE_CSS@@
  </style>
</head>
<body>
  <div id="assistant-console-root">
    <header class="hud" data-component="hud">
      <div class="hud-in">
        <div class="hud-row">
          <div class="brand">
            <span class="logo" aria-hidden="true">N</span>
            <span>assistant 指挥台</span>
          </div>
          <div class="stats" id="console-hud-stats" role="region" aria-label="全局指标">
            <div class="stat hot" data-metric="pending" title="等你出手：待处理清单里还没处理的条数">
              <b class="stat-val">—</b>
              <span class="stat-lbl">等你出手</span>
            </div>
            <div class="stat run" data-metric="running" title="进行中的副本：正在跑的派发任务数">
              <b class="stat-val">—</b>
              <span class="stat-lbl">进行中</span>
            </div>
            <div class="stat ok" data-metric="today-progress" title="今日通关 / 今日出发">
              <b class="stat-val">—</b>
              <span class="stat-lbl">今日通关/出发</span>
              <div class="bar" aria-hidden="true"><i style="width:0%"></i></div>
            </div>
            <div class="stat" data-metric="week-completed" title="本周通关：本周完成的派发任务数">
              <b class="stat-val">—</b>
              <span class="stat-lbl">本周通关</span>
            </div>
            <div class="stat fire" data-metric="clear-streak" title="连续清空待处理：连续几天在当天结束前清空了待处理">
              <b class="stat-val">—</b>
              <span class="stat-lbl">连续清空</span>
            </div>
          </div>
          <span class="chan" id="console-channel-state" hidden></span>
          <button type="button" class="upd" id="console-records-changed" hidden>记录有更新 · 刷新</button>
          <span class="gen" id="console-gen-time">生成于 --:-- · 页面不会自动刷新</span>
        </div>
        <nav class="tabs" id="console-tabs" role="tablist" aria-label="页面导航">
          <button type="button" class="tab-btn on" role="tab" aria-selected="true" data-page="pending">
            <span>待处理</span>
            <span class="badge" id="tab-badge-pending">—</span>
          </button>
          <button type="button" class="tab-btn" role="tab" aria-selected="false" data-page="dispatch">
            <span>派发确认</span>
          </button>
          <button type="button" class="tab-btn" role="tab" aria-selected="false" data-page="runs">
            <span>运行监督</span>
          </button>
          <button type="button" class="tab-btn" role="tab" aria-selected="false" data-page="roles">
            <span>角色管理</span>
          </button>
        </nav>
      </div>
    </header>

    <div class="console-banner" id="console-banner" role="status" hidden></div>
    <main id="console-main" class="main-viewport" role="main"></main>

    <footer class="console-footer" role="contentinfo">
      <div class="footer-in">
        <p class="credit">角色形象设计基于 DiceBear Pixel Art（设计 CC0 1.0 · 代码 MIT），单文件离线内嵌。</p>
      </div>
    </footer>
  </div>

  <div class="dock" id="console-dock" role="region" aria-label="指令导出框" style="display:none">
    <div class="dock-in">
      <div class="dock-head">
        <span class="dock-title" id="console-dock-title">控制台指令</span>
        <span class="dock-status" id="console-dock-status">只包含当前页已选项目</span>
        <button type="button" class="dock-btn" id="console-dock-copy" data-action="copy">复制到剪贴板</button>
        <button type="button" class="dock-close" id="console-dock-close" data-action="close" aria-label="关闭导出框">×</button>
      </div>
      <textarea id="console-dock-text" readonly spellcheck="false" placeholder="（未选择任何有效操作）"></textarea>
      <div class="dock-hint">可选中文本手动复制；剪贴板不可用时请按 Ctrl+C。</div>
    </div>
  </div>

@@SNAPSHOT@@
@@AVATARS@@
@@SCRIPTS@@
</body>
</html>
